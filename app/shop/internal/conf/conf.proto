syntax = "proto3";
package shop.api;

option go_package = "casso/app/shop/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
    Trace trace = 1;
    Server server = 2;
    Discovery discovery = 3;
}

message Trace {
    string endpoint = 1;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
}

message Discovery {
  Nacos nacos = 1;
}

message Nacos {
    string address = 1;
    int64 port = 2;
}
